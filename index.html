
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <link rel="icon" href="/images/xl-logo.png" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>XerveLab</title>
    </head>

    <body>
      <!-- Loader shown on first load -->
      <div id="app-loader" style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      ">
        <div style="position: relative; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center;">
          <!-- Outer arc spinner -->
          <div class="loader-ring loader-ring-outer"></div>
          <!-- Inner arc spinner (counter-rotating) -->
          <div class="loader-ring loader-ring-inner"></div>
          <!-- Glow effect -->
          <div class="loader-glow"></div>
          <!-- Logo -->
          <img
            src="/images/Official-logo.png"
            alt="Loading..."
            style="
              width: 90px;
              height: 90px;
              object-fit: contain;
              image-rendering: -webkit-optimize-contrast;
              animation: logo-glow 2s ease-in-out infinite;
              filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.6)) drop-shadow(0 0 30px rgba(59, 130, 246, 0.2));
            "
          />
        </div>
      </div>
      <style>
        .loader-ring {
          position: absolute;
          border-radius: 50%;
          border: 2px solid transparent;
        }
        .loader-ring-outer {
          inset: 0;
          border-top-color: #3b82f6;
          border-right-color: rgba(59, 130, 246, 0.3);
          animation: spin-loader 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
          box-shadow: 0 0 15px rgba(59, 130, 246, 0.2), inset 0 0 15px rgba(59, 130, 246, 0.05);
        }
        .loader-ring-inner {
          inset: 8px;
          border-bottom-color: #06b6d4;
          border-left-color: rgba(6, 182, 212, 0.3);
          animation: spin-loader-reverse 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
          box-shadow: 0 0 10px rgba(6, 182, 212, 0.2), inset 0 0 10px rgba(6, 182, 212, 0.05);
        }
        .loader-glow {
          position: absolute;
          inset: 15px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
          animation: glow-pulse 2s ease-in-out infinite;
        }
        @keyframes pulse-loader {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.85; transform: scale(0.97); }
        }
        @keyframes logo-glow {
          0%, 100% { filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.6)) drop-shadow(0 0 30px rgba(59, 130, 246, 0.2)); }
          50% { filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.8)) drop-shadow(0 0 40px rgba(59, 130, 246, 0.4)); }
        }
        @keyframes spin-loader {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes spin-loader-reverse {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(-360deg); }
        }
        @keyframes glow-pulse {
          0%, 100% { opacity: 0.5; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.05); }
        }
        #app-loader.fade-out {
          opacity: 0;
          visibility: hidden;
        }
      </style>

      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
